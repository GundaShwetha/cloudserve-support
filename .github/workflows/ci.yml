name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt
      - name: "Tests (offline: TF-IDF retrieval, extractive generation, no API key needed)"
        run: python -m pytest tests/ -v
      - name: Unattended smoke run of the harness
        run: python -m evaluation.harness --input data/samples/demo_tickets.json --output /tmp/ci_run
        env:
          RETRIEVAL_BACKEND: tfidf
          GENERATION_MODE: extractive
      - name: No credentials committed
        run: |
          ! grep -rEn "sk-or-v1-[A-Za-z0-9]{20,}|gsk_[A-Za-z0-9]{20,}" --include=*.py --include=*.md --include=*.yml --include=*.json --include=*.env* . \
            | grep -v "data/samples/demo_tickets.json"
